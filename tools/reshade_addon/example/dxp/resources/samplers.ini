; Named samplers for recipe sampler handles. Optional.
;
; Handles not listed here are derived from their name: a handle containing
; point/linear/aniso and wrap/clamp/mirror/border (e.g. "point_wrap",
; "s_noise_linear_mirror") gets that filter and address mode; anything else is
; linear + clamp.
;
; [handle]
; filter         = point | linear | bilinear | aniso
; address        = wrap | clamp | mirror | border | mirror_once   (sets u, v and w)
; address_u/v/w  = per-axis override
; max_anisotropy = 16
; mip_lod_bias   = 0
; min_lod        = 0
; max_lod        = 1000
; border_color   = 0, 0, 0, 0
; compare        = less | less_equal | greater | ...  (comparison sampler)

[shadow_compare]
filter = linear
address = border
border_color = 1, 1, 1, 1
compare = less_equal
