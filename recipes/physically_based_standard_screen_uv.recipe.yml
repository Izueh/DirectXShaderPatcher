version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: add_temp
    name: add_screen_uv_temp
    if:
      state: require_sm5_0
    handles: [screen_uv_temp]

  - kind: add_input
    name: add_screen_uv_x
    if:
      state: require_sm5_0
    handle: screen_uv_x
    auto_bind: true
    interpolation_mode: linear

  - kind: add_input
    name: add_screen_uv_y
    if:
      state: require_sm5_0
    handle: screen_uv_y
    auto_bind: true
    interpolation_mode: linear

  - kind: add_output
    name: add_screen_uv_out
    if:
      state: require_sm5_0
    handle: screen_uv_out
    auto_bind: true

  - name: inject_screen_uv_math
    if:
      state: require_sm5_0
    mode: match_all
    rules:
      - name: inject_screen_uv_math_rule
        match:
          rewrite_mode: replace_range
          sequence:
            - opcode: ret
        emit:
          - opcode: div
            operands:
              - { type: temp, from_handle: screen_uv_temp, components: { kind: mask, value: xy } }
              - { type: input, from_handle: screen_uv_x, components: { kind: swizzle, value: xyxx } }
              - { type: input, from_handle: screen_uv_x, components: { kind: swizzle, value: wwww } }
          - opcode: div
            operands:
              - { type: temp, from_handle: screen_uv_temp, components: { kind: mask, value: zw } }
              - { type: input, from_handle: screen_uv_y, components: { kind: swizzle, value: xxxy } }
              - { type: input, from_handle: screen_uv_y, components: { kind: swizzle, value: wwww } }
          - opcode: add
            operands:
              - { type: temp, from_handle: screen_uv_temp, components: { kind: mask, value: xy } }
              - { type: temp, from_handle: screen_uv_temp, modifier: neg, components: { kind: swizzle, value: zwzz } }
              - { type: temp, from_handle: screen_uv_temp, components: { kind: swizzle, value: xyxx } }
          - opcode: mul
            operands:
              - { type: output, from_handle: screen_uv_out, components: { kind: mask, value: xy } }
              - { type: temp, from_handle: screen_uv_temp, components: { kind: swizzle, value: xyxx } }
              - type: immediate32
                indices:
                  - { immediate_lo: 0x3F000000 }
                  - { immediate_lo: 0xBF000000 }
                  - { immediate_lo: 0x00000000 }
                  - { immediate_lo: 0x00000000 }
          - opcode: ret
