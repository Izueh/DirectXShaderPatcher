version: 1
temp_decls:
  - handle: raw_probe
  - handle: uav_probe
steps:
  - kind: prefilter
    name: require_sm5_0
    checks:
      - kind: check_shader_version
        major: 5
        minor: 0

  - kind: add_raw_resource
    name: add_injected_raw_srv
    if:
      state: require_sm5_0
    handle: injected_raw_srv
    auto_bind: true

  - kind: add_structured_resource
    name: add_injected_structured_srv
    if:
      state: require_sm5_0
    handle: injected_structured_srv
    auto_bind: true
    stride: 16

  - kind: add_uav
    name: add_injected_raw_uav
    if:
      state: require_sm5_0
    handle: injected_raw_uav
    auto_bind: true
    uav_kind: raw

  - name: verify_bind_handles_in_emit
    if:
      state: require_sm5_0
    rules:
      - match:
          rewrite_mode: ReplaceRange
          sequence:
            - opcode: mul
              operands:
                - capture: dst
                - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - capture: src
          - opcode: mov
            operands:
              - type: temp
                bind_handle: raw_probe
              - type: resource
                bind_handle: injected_raw_srv
          - opcode: mov
            operands:
              - type: temp
                bind_handle: uav_probe
              - type: unordered_access_view
                bind_handle: injected_raw_uav
