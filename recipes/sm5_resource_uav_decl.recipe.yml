version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: add_temp
    name: add_raw_probe_temp
    if:
      state: require_sm5_0
    handles: [raw_probe]

  - kind: add_temp
    name: add_uav_probe_temp
    if:
      state: require_sm5_0
    handles: [uav_probe]

  - kind: add_raw_resource
    name: add_injected_raw_srv
    if:
      state: require_sm5_0
    handle: injected_raw_srv
    auto_bind: true

  - kind: add_structured_resource
    name: add_injected_structured_srv
    if:
      state: require_sm5_0
    handle: injected_structured_srv
    auto_bind: true
    stride: 16

  - kind: add_uav
    name: add_injected_raw_uav
    if:
      state: require_sm5_0
    handle: injected_raw_uav
    auto_bind: true
    uav_kind: raw

  - name: verify_from_handles_in_emit
    if:
      state: require_sm5_0
    rules:
      - name: verify_from_handles_rule
        match:
          rewrite_mode: replace_range
          sequence:
            - opcode: mul
              operands:
                - capture: dst
                - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - capture: src
          - opcode: mov
            operands:
              - type: temp
                from_handle: raw_probe
              - type: resource
                from_handle: injected_raw_srv
          - opcode: mov
            operands:
              - type: temp
                from_handle: uav_probe
              - type: unordered_access_view
                from_handle: injected_raw_uav
