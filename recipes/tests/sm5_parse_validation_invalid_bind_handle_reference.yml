version: 1
prefilters:
  - kind: check_shader_version
    major: 5
    minor: 0
steps:
  - name: bind_validate
    rules:
      - match:
          opcode: sample_l
          operands:
            - capture: dst
            - capture: coord
        emit:
          - opcode: sample_l
            operands:
              - capture: dst
              - capture: coord
              - type: resource
                bind_handle: missing_texture
              - type: sampler
                indices: [0]
              - type: immediate32
                immediates_f32: [0.0]
