version: 1

rewrite_rules:
  - id: strip_ign_outer_frc
    match:
      opcode: Frc
      capture: ign_root
      replace: ign_root
      mode: Replace
      prune_dead: true
      operands:
        - index: 1
          kind: instruction
          opcode: fmul
          capture: outer_mul
          operands:
            - index: 0
              kind: dxop
              opcode: Frc
              capture: inner_frc
              operands:
                - index: 1
                  kind: dxop
                  opcode: Dot2
                  capture: dot_call
                  operands:
                    - index: 1
                      kind: any
                      capture: raw_x
                    - index: 2
                      kind: any
                      capture: raw_y
                    - index: 3
                      kind: any
                      capture: dot_c0
                    - index: 4
                      kind: any
                      capture: dot_c1
            - index: 1
              kind: any
              capture: scale
    replace_with_capture: inner_frc

steps:
  - kind: apply_rule
    rule: strip_ign_outer_frc
    name: strip_ign_outer_frc
    mode: MatchAll
    required: true
  - kind: prune_dead_code
