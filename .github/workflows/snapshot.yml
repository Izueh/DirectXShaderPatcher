name: Snapshot

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-or-release:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Compute release identity
      - name: Compute version identity
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SNAPSHA=$(git rev-parse --short=8 HEAD)
            {
              echo "ARTIFACT_VERSION=snapshot-$SNAPSHA"
              echo "RELEASE_TAG=snapshot"
              echo "IS_PRERELEASE=true"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ARTIFACT_VERSION=${GITHUB_REF_NAME#v}"
              echo "RELEASE_TAG=${GITHUB_REF_NAME}"
              echo "IS_PRERELEASE=false"
            } >> "$GITHUB_ENV"
          fi

      # Check if CI artifacts exist for this commit
      - name: Check for existing CI artifacts
        id: check-artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.payload.commits?.[0]?.id
              || await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: context.ref
                }).then(r => r.data.sha);

            // Release artifacts: MSVC ninja only, /MD + /MT variants.
            const workflows = ['ninja-x64', 'ninja-x86'];
            const runIds = {};
            let allFound = true;

            for (const wf of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf + '.yml',
                head_sha: commitSha,
                status: 'success',
                per_page: 1
              });
              if (runs.data.workflow_runs.length > 0) {
                runIds[wf] = runs.data.workflow_runs[0].id;
              } else {
                allFound = false;
              }
            }

            core.setOutput('exists', allFound);
            core.setOutput('runIds', JSON.stringify(runIds));
            core.info(`Artifacts exist: ${allFound}`);

      # ── PATH A: Download existing CI artifacts ──
      - name: Download CI artifacts
        if: steps.check-artifacts.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ninja-*
          merge-multiple: false
          path: out/install/
          run-id: ${{ fromJSON(steps.check-artifacts.outputs.runIds)['ninja-x64'] }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── PATH B: Build from scratch (lean by default) ──
      - name: Configure build for amd64
        if: steps.check-artifacts.outputs.exists != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --preset ninja-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --preset ninja-x64-static -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64 Release + Debug)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --build --parallel --preset ninja-x64-release
          cmake --build --parallel --preset ninja-x64-debug
          cmake --build --parallel --preset ninja-x64-static-release
          cmake --build --parallel --preset ninja-x64-static-debug

      - name: Test (x64 Release)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          ctest --preset ninja-x64-release --output-on-failure
          ctest --preset ninja-x64-static-release --output-on-failure

      - name: Install SDK (x64)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x64
          cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x64
          cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherCLI --prefix githubrelease/x64
          cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherCLI --prefix githubrelease/x64
          cmake --install out/build/ninja-x64-static --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x64-static
          cmake --install out/build/ninja-x64-static --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x64-static
          cmake --install out/build/ninja-x64-static --config Release --component DirectXShaderPatcherCLI --prefix githubrelease/x64-static
          cmake --install out/build/ninja-x64-static --config Debug --component DirectXShaderPatcherCLI --prefix githubrelease/x64-static

      - name: Configure build for x86
        if: steps.check-artifacts.outputs.exists != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --preset ninja-x86 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --preset ninja-x86-static -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x86 Release + Debug)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --build --parallel --preset ninja-x86-release
          cmake --build --parallel --preset ninja-x86-debug
          cmake --build --parallel --preset ninja-x86-static-release
          cmake --build --parallel --preset ninja-x86-static-debug

      - name: Test (x86 Release)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          ctest --preset ninja-x86-release --output-on-failure
          ctest --preset ninja-x86-static-release --output-on-failure

      - name: Install SDK (x86)
        if: steps.check-artifacts.outputs.exists != 'true'
        run: |
          cmake --install out/build32/ninja-x86 --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x86
          cmake --install out/build32/ninja-x86 --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x86
          cmake --install out/build32/ninja-x86-static --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x86-static
          cmake --install out/build32/ninja-x86-static --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x86-static

      - name: Show sccache stats
        if: steps.check-artifacts.outputs.exists != 'true'
        run: sccache --show-stats

      # ── Common: package and release ──
      # (PATH B installs straight into githubrelease/; PATH A copies below.)

      - name: Prepare githubrelease from artifacts
        if: steps.check-artifacts.outputs.exists == 'true'
        run: |
          xcopy /E /I /Y out\install\ninja-x64 githubrelease\x64
          xcopy /E /I /Y out\install\ninja-x64-static githubrelease\x64-static
          xcopy /E /I /Y out\install\ninja-x86 githubrelease\x86
          xcopy /E /I /Y out\install\ninja-x86-static githubrelease\x86-static

      - name: Package artifacts
        shell: powershell
        run: |
          $v = $env:ARTIFACT_VERSION
          $archToLabel = @{
            'x64' = 'ninja-x64'
            'x64-static' = 'ninja-x64-static'
            'x86' = 'ninja-x86'
            'x86-static' = 'ninja-x86-static'
          }
          foreach ($entry in $archToLabel.GetEnumerator()) {
            $arch = $entry.Key
            $label = $entry.Value
            if (Test-Path "githubrelease/$arch") {
              Compress-Archive -Path "githubrelease/$arch/*" -DestinationPath "githubrelease/DirectXShaderPatcher-$v-$label.zip" -Force
            }
          }
          Get-ChildItem githubrelease -Filter *.zip | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } | Set-Content githubrelease/SHA256SUMS

      - name: Create a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DirectXShaderPatcher ${{ env.ARTIFACT_VERSION }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            githubrelease/*.zip
            githubrelease/SHA256SUMS
