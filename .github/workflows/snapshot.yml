name: Snapshot

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Compute release identity
      - name: Compute version identity
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SNAPSHA=$(git rev-parse --short=8 HEAD)
            echo "ARTIFACT_VERSION=snapshot-$SNAPSHA" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=snapshot" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Take the SDK artifacts produced by the latest successful per-push run
      # (each ninja workflow uploads one artifact per CRT variant).
      - name: Find latest CI artifacts
        id: find-artifacts
        uses: actions/github-script@v7
        with:
          script: |
            for (const wf of ['ninja-x64.yml', 'ninja-x86.yml']) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                status: 'success',
                per_page: 1
              });
              if (runs.data.workflow_runs.length === 0) {
                core.setFailed(`No successful ${wf} run found; push to main first.`);
                return;
              }
              core.setOutput(wf === 'ninja-x64.yml' ? 'x64RunId' : 'x86RunId', runs.data.workflow_runs[0].id);
              core.info(`${wf}: run ${runs.data.workflow_runs[0].id}`);
            }

      - name: Download x64 CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ninja-x64*
          merge-multiple: false
          path: out/install/
          run-id: ${{ steps.find-artifacts.outputs.x64RunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download x86 CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ninja-x86*
          merge-multiple: false
          path: out/install/
          run-id: ${{ steps.find-artifacts.outputs.x86RunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release folders
        run: |
          xcopy /E /I /Y out\install\ninja-x64 githubrelease\x64
          xcopy /E /I /Y out\install\ninja-x64-static githubrelease\x64-static
          xcopy /E /I /Y out\install\ninja-x86 githubrelease\x86
          xcopy /E /I /Y out\install\ninja-x86-static githubrelease\x86-static

      - name: Package artifacts
        shell: powershell
        run: |
          $v = $env:ARTIFACT_VERSION
          $archToLabel = @{
            'x64' = 'ninja-x64'
            'x64-static' = 'ninja-x64-static'
            'x86' = 'ninja-x86'
            'x86-static' = 'ninja-x86-static'
          }
          foreach ($entry in $archToLabel.GetEnumerator()) {
            $arch = $entry.Key
            $label = $entry.Value
            if (Test-Path "githubrelease/$arch") {
              Compress-Archive -Path "githubrelease/$arch/*" -DestinationPath "githubrelease/DirectXShaderPatcher-$v-$label.zip" -Force
            }
          }
          Get-ChildItem githubrelease -Filter *.zip | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } | Set-Content githubrelease/SHA256SUMS

      - name: Create a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DirectXShaderPatcher ${{ env.ARTIFACT_VERSION }}
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            githubrelease/*.zip
            githubrelease/SHA256SUMS
