name: Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"
      DXP_IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Version identity: tagged pushes (v*) are releases named by the tag;
      # main pushes are snapshots carrying their commit SHA in the version
      # string (<ver>+snapshot.<sha>, SemVer build metadata) and artifact names.
      - name: Compute version identity
        shell: bash
        run: |
          if [ "$DXP_IS_RELEASE" == "true" ]; then
            SNAPSHA=""
            echo "ARTIFACT_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            SNAPSHA=$(git rev-parse --short=8 HEAD)
            echo "ARTIFACT_VERSION=snapshot-$SNAPSHA" >> $GITHUB_ENV
            echo "RELEASE_TAG=snapshot" >> $GITHUB_ENV
          fi
          echo "SNAPSHA=$SNAPSHA" >> $GITHUB_ENV

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset ninja-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDXP_SNAPSHOT_SHA=${{ env.SNAPSHA }}

      - name: Build (x64)
        run: cmake --build --preset ninja-x64-release --parallel

      # Test gate: a commit that breaks the test suite must not update the
      # rolling snapshot release. Failing tests abort the job, so the release
      # step below never runs. Tests are x64-only (dxp_add_test returns early
      # for x86), so one ctest run covers the suite.
      - name: Test (x64 Release)
        run: ctest --preset ninja-x64-release --output-on-failure

      - name: Build Debug (x64)
        run: cmake --build --preset ninja-x64-debug --parallel

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        run: cmake --preset ninja-x86 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDXP_SNAPSHOT_SHA=${{ env.SNAPSHA }}

      - name: Build (x86)
        run: cmake --build --preset ninja-x86-release --parallel

      - name: Build Debug (x86)
        run: cmake --build --preset ninja-x86-debug --parallel

      - name: Configure CMake (clang-x86)
        run: cmake --preset clang-x86 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDXP_SNAPSHOT_SHA=${{ env.SNAPSHA }}

      - name: Build (clang-x86)
        run: cmake --build --preset clang-x86-release --parallel

      - name: Build Debug (clang-x86)
        run: cmake --build --preset clang-x86-debug --parallel

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare Release folder
        run: md githubrelease

      - name: Install SDK (x64 Release)
        run: cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x64
      - name: Install SDK (x64 Debug)
        run: cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x64
      - name: Install CLI (x64 Release)
        run: cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherCLI --prefix githubrelease/x64
      - name: Install CLI (x64 Debug)
        run: cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherCLI --prefix githubrelease/x64

      - name: Install SDK (x86 Release)
        run: cmake --install out/build32/ninja-x86 --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/x86
      - name: Install SDK (x86 Debug)
        run: cmake --install out/build32/ninja-x86 --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/x86

      - name: Install SDK (clang-x86 Release)
        run: cmake --install out/build32/clang-x86 --config Release --component DirectXShaderPatcherSDK --prefix githubrelease/clang-x86
      - name: Install SDK (clang-x86 Debug)
        run: cmake --install out/build32/clang-x86 --config Debug --component DirectXShaderPatcherSDK --prefix githubrelease/clang-x86

      - name: Package artifacts
        shell: powershell
        run: |
          $v = $env:ARTIFACT_VERSION
          # Toolchain-qualified zip names: ninja (MSVC) x64/x86 and clang x86.
          $archToLabel = @{ 'x64' = 'ninja-x64'; 'x86' = 'ninja-x86'; 'clang-x86' = 'clang-x86' }
          foreach ($entry in $archToLabel.GetEnumerator()) {
            $arch = $entry.Key
            $label = $entry.Value
            if (Test-Path "githubrelease/$arch") {
              Compress-Archive -Path "githubrelease/$arch/*" -DestinationPath "githubrelease/DirectXShaderPatcher-$v-$label.zip" -Force
            }
          }
          Get-ChildItem githubrelease -Filter *.zip | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } | Set-Content githubrelease/SHA256SUMS

      - name: Create a Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ env.RELEASE_TAG }}
          title: DirectXShaderPatcher ${{ env.ARTIFACT_VERSION }}
          # Snapshots (main pushes) are pre-releases so the curated SemVer
          # release stays "Latest" on the Releases page; tagged v* pushes are
          # real releases.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            githubrelease/*.zip
            githubrelease/SHA256SUMS
