name: Ninja x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset ninja-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64)
        run: cmake --build --parallel --preset ninja-x64-release

      - name: Build Debug (x64)
        run: cmake --build --parallel --preset ninja-x64-debug

      - name: Test (x64)
        run: ctest --preset ninja-x64-release --output-on-failure

      - name: Install SDK (x64 Release)
        run: cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherSDK --prefix out/install/ninja-x64

      - name: Install SDK (x64 Debug)
        run: cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherSDK --prefix out/install/ninja-x64

      - name: Install CLI (x64 Release)
        run: cmake --install out/build/ninja-x64 --config Release --component DirectXShaderPatcherCLI --prefix out/install/ninja-x64

      - name: Install CLI (x64 Debug)
        run: cmake --install out/build/ninja-x64 --config Debug --component DirectXShaderPatcherCLI --prefix out/install/ninja-x64

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninja-x64
          path: out/install/ninja-x64/
          retention-days: 7

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
