name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Compile And Package Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Release Version
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            $releaseName = $releaseTag
            $prerelease = "false"
          }
          else {
            $releaseTag = "nightly-${{ github.run_number }}"
            $releaseName = $releaseTag
            $prerelease = "true"
          }

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Configure Native Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-sccache
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-sccache-
            ${{ runner.os }}-${{ runner.arch }}-sccache-
          max-size: 2G

      - name: Prepare Staging Directory
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "artifacts/release" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "artifacts/release" | Out-Null
          New-Item -ItemType Directory -Path "artifacts/release/clang-debug" | Out-Null
          New-Item -ItemType Directory -Path "artifacts/release/msvc-debug" | Out-Null
          New-Item -ItemType Directory -Path "artifacts/release/clang-release" | Out-Null
          New-Item -ItemType Directory -Path "artifacts/release/msvc-release" | Out-Null

      - name: Build And Install Clang Debug Package
        shell: pwsh
        run: |
          cmake --preset ninja-clang-debug -DDXP_ENABLE_SDK_INSTALL=ON -DDXP_SDK_TOOLSET_SUBDIR=clang
          cmake --build --preset ninja-clang-debug --target dxp_lib dxcompiler dxp
          cmake --install "out/build/ninja-clang-debug" --component DirectXShaderPatcherSDK --prefix "$env:GITHUB_WORKSPACE/artifacts/release/clang-debug"
          cmake --install "out/build/ninja-clang-debug" --component DirectXShaderPatcherCLI --prefix "$env:GITHUB_WORKSPACE/artifacts/release/clang-debug"
          if (Test-Path "artifacts/release/clang-debug/DirectXShaderPatcher_SDK") {
            Move-Item -Path "artifacts/release/clang-debug/DirectXShaderPatcher_SDK" -Destination "artifacts/release/clang-debug/DirectXShaderPatcher"
          }

      - name: Build And Install MSVC Debug Package
        shell: pwsh
        run: |
          cmake --preset ninja-msvc-debug -DDXP_ENABLE_SDK_INSTALL=ON -DDXP_SDK_TOOLSET_SUBDIR=msvc
          cmake --build --preset ninja-msvc-debug --target dxp_lib dxcompiler dxp
          cmake --install "out/build/ninja-msvc-debug" --component DirectXShaderPatcherSDK --prefix "$env:GITHUB_WORKSPACE/artifacts/release/msvc-debug"
          cmake --install "out/build/ninja-msvc-debug" --component DirectXShaderPatcherCLI --prefix "$env:GITHUB_WORKSPACE/artifacts/release/msvc-debug"
          if (Test-Path "artifacts/release/msvc-debug/DirectXShaderPatcher_SDK") {
            Move-Item -Path "artifacts/release/msvc-debug/DirectXShaderPatcher_SDK" -Destination "artifacts/release/msvc-debug/DirectXShaderPatcher"
          }

      - name: Build And Install Clang Release Package
        shell: pwsh
        run: |
          cmake --preset ninja-clang-release -DDXP_ENABLE_SDK_INSTALL=ON -DDXP_SDK_TOOLSET_SUBDIR=clang
          cmake --build --preset ninja-clang-release --target dxp_lib dxcompiler dxp
          cmake --install "out/build/ninja-clang-release" --component DirectXShaderPatcherSDK --prefix "$env:GITHUB_WORKSPACE/artifacts/release/clang-release"
          cmake --install "out/build/ninja-clang-release" --component DirectXShaderPatcherCLI --prefix "$env:GITHUB_WORKSPACE/artifacts/release/clang-release"
          if (Test-Path "artifacts/release/clang-release/DirectXShaderPatcher_SDK") {
            Move-Item -Path "artifacts/release/clang-release/DirectXShaderPatcher_SDK" -Destination "artifacts/release/clang-release/DirectXShaderPatcher"
          }

      - name: Build And Install MSVC Release Package
        shell: pwsh
        run: |
          cmake --preset ninja-msvc-release -DDXP_ENABLE_SDK_INSTALL=ON -DDXP_SDK_TOOLSET_SUBDIR=msvc
          cmake --build --preset ninja-msvc-release --target dxp_lib dxcompiler dxp
          cmake --install "out/build/ninja-msvc-release" --component DirectXShaderPatcherSDK --prefix "$env:GITHUB_WORKSPACE/artifacts/release/msvc-release"
          cmake --install "out/build/ninja-msvc-release" --component DirectXShaderPatcherCLI --prefix "$env:GITHUB_WORKSPACE/artifacts/release/msvc-release"
          if (Test-Path "artifacts/release/msvc-release/DirectXShaderPatcher_SDK") {
            Move-Item -Path "artifacts/release/msvc-release/DirectXShaderPatcher_SDK" -Destination "artifacts/release/msvc-release/DirectXShaderPatcher"
          }

      - name: Archive Distribution Packages
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/release/clang-debug/*" -DestinationPath "artifacts/DirectXShaderPatcher-clang-debug.zip" -Force
          Compress-Archive -Path "artifacts/release/msvc-debug/*" -DestinationPath "artifacts/DirectXShaderPatcher-msvc-debug.zip" -Force
          Compress-Archive -Path "artifacts/release/clang-release/*" -DestinationPath "artifacts/DirectXShaderPatcher-clang-release.zip" -Force
          Compress-Archive -Path "artifacts/release/msvc-release/*" -DestinationPath "artifacts/DirectXShaderPatcher-msvc-release.zip" -Force

      - name: Generate GitHub Release Asset Package
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/DirectXShaderPatcher-clang-debug.zip
            artifacts/DirectXShaderPatcher-msvc-debug.zip
            artifacts/DirectXShaderPatcher-clang-release.zip
            artifacts/DirectXShaderPatcher-msvc-release.zip
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}