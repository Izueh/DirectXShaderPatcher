name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Compile And Package Artifacts
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Release Version
        id: release_meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            $releaseName = $releaseTag
            $prerelease = "false"
          }
          else {
            $releaseTag = "nightly-${{ github.sha }}"
            $releaseName = $releaseTag
            $prerelease = "true"
          }

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Configure Native Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup Compiler Cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare Artifacts Directory
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "artifacts" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "artifacts" | Out-Null

      - name: Build And Package Clang Debug
        shell: pwsh
        run: |
          cmake --preset ninja-clang-debug
          cmake --build --preset ninja-clang-debug --parallel
          $p = "$env:GITHUB_WORKSPACE/artifacts/clang-debug"
          cmake --install "out/build/ninja-clang-debug" --component DirectXShaderPatcherSDK --prefix $p
          cmake --install "out/build/ninja-clang-debug" --component DirectXShaderPatcherCLI --prefix $p
          if (Test-Path "${p}/DirectXShaderPatcher_SDK") {
            Move-Item -Path "${p}/DirectXShaderPatcher_SDK" -Destination "${p}/DirectXShaderPatcher"
          }
          Compress-Archive -Path "${p}/*" -DestinationPath "artifacts/DirectXShaderPatcher-clang-debug.zip" -Force

      - name: Build And Package MSVC Debug
        shell: pwsh
        run: |
          cmake --preset ninja-msvc-debug
          cmake --build --preset ninja-msvc-debug --parallel
          $p = "$env:GITHUB_WORKSPACE/artifacts/msvc-debug"
          cmake --install "out/build/ninja-msvc-debug" --component DirectXShaderPatcherSDK --prefix $p
          cmake --install "out/build/ninja-msvc-debug" --component DirectXShaderPatcherCLI --prefix $p
          if (Test-Path "${p}/DirectXShaderPatcher_SDK") {
            Move-Item -Path "${p}/DirectXShaderPatcher_SDK" -Destination "${p}/DirectXShaderPatcher"
          }
          Compress-Archive -Path "${p}/*" -DestinationPath "artifacts/DirectXShaderPatcher-msvc-debug.zip" -Force

      - name: Build And Package Clang Release
        shell: pwsh
        run: |
          cmake --preset ninja-clang-release
          cmake --build --preset ninja-clang-release --parallel
          $p = "$env:GITHUB_WORKSPACE/artifacts/clang-release"
          cmake --install "out/build/ninja-clang-release" --component DirectXShaderPatcherSDK --prefix $p
          cmake --install "out/build/ninja-clang-release" --component DirectXShaderPatcherCLI --prefix $p
          if (Test-Path "${p}/DirectXShaderPatcher_SDK") {
            Move-Item -Path "${p}/DirectXShaderPatcher_SDK" -Destination "${p}/DirectXShaderPatcher"
          }
          Compress-Archive -Path "${p}/*" -DestinationPath "artifacts/DirectXShaderPatcher-clang-release.zip" -Force

      - name: Build And Package MSVC Release
        shell: pwsh
        run: |
          cmake --preset ninja-msvc-release
          cmake --build --preset ninja-msvc-release --parallel
          $p = "$env:GITHUB_WORKSPACE/artifacts/msvc-release"
          cmake --install "out/build/ninja-msvc-release" --component DirectXShaderPatcherSDK --prefix $p
          cmake --install "out/build/ninja-msvc-release" --component DirectXShaderPatcherCLI --prefix $p
          if (Test-Path "${p}/DirectXShaderPatcher_SDK") {
            Move-Item -Path "${p}/DirectXShaderPatcher_SDK" -Destination "${p}/DirectXShaderPatcher"
          }
          Compress-Archive -Path "${p}/*" -DestinationPath "artifacts/DirectXShaderPatcher-msvc-release.zip" -Force

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Generate GitHub Release Asset Package
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/DirectXShaderPatcher-clang-debug.zip
            artifacts/DirectXShaderPatcher-msvc-debug.zip
            artifacts/DirectXShaderPatcher-clang-release.zip
            artifacts/DirectXShaderPatcher-msvc-release.zip
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}