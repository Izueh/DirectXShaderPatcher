name: Clang x86 (compat smoke)

# clang-cl builds are NOT release artifacts anymore (MSVC is the supported
# toolchain; clang doubles CI cost for a second flavor of the same ABI).
# Kept as a fast compatibility smoke for the x86 SM5-only core. Both CRT
# variants are exercised so DXP_CRT=Static stays working under clang-cl.
# No install/upload.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-x86, clang-x86-static]
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (Release)
        run: cmake --build --parallel --preset ${{ matrix.preset }}-release

      - name: Test (Release)
        run: ctest --preset ${{ matrix.preset }}-release --output-on-failure

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
