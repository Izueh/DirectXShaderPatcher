version: 1
steps:
  - kind: apply_rules
    name: mixed_immediate_variables
    if:
      input: enable_noise_patch
    rules:
      - match:
          opcode: mul
          operands:
            - capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - type: immediate32
                immediates_u32: [0x3F800000, frame_seed, 0]
          - opcode: mov
            operands:
              - capture: dst
              - type: immediate64
                immediates_f64: [frame_double]
