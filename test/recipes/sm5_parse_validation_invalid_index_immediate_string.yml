version: 1
steps:
  - kind: apply_rules
    name: invalid_index_immediate_probe
    rules:
      - name: rule
        match:
          opcode: mov
          operands:
            - capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - type: temp
                indices:
                  - representation: immediate32
                    immediate_lo: shared_temp_r
              - capture: src
