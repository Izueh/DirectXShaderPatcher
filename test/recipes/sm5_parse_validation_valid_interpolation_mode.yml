version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: add_input
    name: add_interpolated_input
    handle: interpolated_input
    auto_bind: true
    interpolation_mode: linear

  - name: interpolation_mode_ok
    rules:
      - name: interpolation_mode_ok_rule
        match:
          opcode: ret
        emit:
          - opcode: dcl_input_ps
            interpolation_mode: linear
            operands:
              - type: input
                from_handle: interpolated_input
                components:
                  kind: mask
                  value: xyzw
          - opcode: ret
