version: 1
steps:
  - kind: prefilter
    name: require_sm5_0
    checks:
      - kind: check_shader_version
        major: 5
        minor: 0

  - kind: add_input
    name: add_interpolated_input
    handle: interpolated_input
    auto_bind: true
    interpolation_mode: linear

  - name: interpolation_mode_ok
    rules:
      - match:
          opcode: ret
        emit:
          - opcode: dcl_input_ps
            interpolation_mode: linear
            operands:
              - type: input
                bind_handle: interpolated_input
                components:
                  kind: mask
                  value: xyzw
          - opcode: ret
