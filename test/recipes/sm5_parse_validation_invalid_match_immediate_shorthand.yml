version: 1
steps:
  - kind: apply_rules
    name: invalid_match_immediate_shorthand
    rules:
      - name: rule
        match:
          opcode: mov
          operands:
            - capture: dst
            - type: immediate32
              immediates_u32: [0x3F000000]
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - type: immediate32
                indices:
                  - immediate_lo: 0
