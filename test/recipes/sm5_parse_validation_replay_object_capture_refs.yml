version: 1
steps:
  - kind: apply_rules
    name: replay_object_capture_refs
    rules:
      - name: rule
        match:
          opcode: mul
          capture: inst
          rewrite_mode: before
          insert_relative_index: 0
          operands:
            - type: temp
              capture: dst
              indices:
                - representation: immediate32
                  capture: dst_reg
            - match_capture: { from: dst }
        emit:
          - opcode: mov
            operands:
              - capture: { from: dst }
              - type: temp
                indices:
                  - representation: immediate32
                    immediate_lo: { from: dst_reg }
