version: 1
steps:
  - kind: add_temp
    name: add_tmp0
    handles: [tmp0]

  - kind: apply_rules
    name: use_tmp0
    rules:
      - name: use_tmp0_rule
        match:
          opcode: mov
          operands:
            - capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - type: temp
                from_handle: tmp0
              - capture: src
