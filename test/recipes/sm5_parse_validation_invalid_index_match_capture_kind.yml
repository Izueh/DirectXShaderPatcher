version: 1
steps:
  - kind: apply_rules
    name: invalid_index_match_capture_kind
    rules:
      - name: rule
        match:
          opcode: mov
          operands:
            - type: temp
              capture: dst
              indices:
                - representation: immediate32
                  match_capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - capture: src
