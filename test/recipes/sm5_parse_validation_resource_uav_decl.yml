version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: add_raw_resource
    name: add_raw_srv
    handle: raw_srv
    auto_bind: true

  - kind: add_structured_resource
    name: add_structured_srv
    handle: structured_srv
    auto_bind: true
    stride: 16

  - kind: add_uav
    name: add_raw_uav
    handle: raw_uav
    auto_bind: true
    uav_kind: raw

  - name: resource_uav_from_handle
    rules:
      - name: rule
        match:
          opcode: mul
          operands:
            - capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - capture: src
          - opcode: mov
            operands:
              - type: temp
                indices:
                  - immediate_lo: 0
              - type: resource
                from_handle: raw_srv
          - opcode: mov
            operands:
              - type: temp
                indices:
                  - immediate_lo: 1
              - type: unordered_access_view
                from_handle: raw_uav
