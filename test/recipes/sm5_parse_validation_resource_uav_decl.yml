version: 1
steps:
  - kind: prefilter
    name: require_sm5_0
    checks:
      - kind: check_shader_version
        major: 5
        minor: 0

  - kind: add_raw_resource
    name: add_raw_srv
    handle: raw_srv
    auto_bind: true

  - kind: add_structured_resource
    name: add_structured_srv
    handle: structured_srv
    auto_bind: true
    stride: 16

  - kind: add_uav
    name: add_raw_uav
    handle: raw_uav
    auto_bind: true
    uav_kind: raw

  - name: resource_uav_bind_handle
    rules:
      - match:
          opcode: mul
          operands:
            - capture: dst
            - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: dst
              - capture: src
          - opcode: mov
            operands:
              - type: temp
                indices: [0]
              - type: resource
                bind_handle: raw_srv
          - opcode: mov
            operands:
              - type: temp
                indices: [1]
              - type: unordered_access_view
                bind_handle: raw_uav
