version: 1
steps:
  - kind: add_temp
    name: add_ign_sample_coord
    handles: [ign_sample_coord]

  - kind: add_cbuffer
    name: add_frame_constants
    handle: frame_constants
    auto_bind: true
    elements: 1
    access_pattern: immediate_indexed

  - kind: add_texture
    name: add_ign_blue_noise
    handle: ign_blue_noise
    auto_bind: true
    dimension: texture_2d_array

  - kind: add_sampler
    name: add_ign_sampler
    handle: ign_sampler
    auto_bind: true
    sampler_mode: default

  - name: objective
    rules:
      - name: objective_rule
        match:
          rewrite_mode: replace_range
          sequence:
            - opcode: dp2
              capture: ign_dp2
              operands:
                - type: temp
                  capture: ign_dst
                - capture: ign_coord
            - opcode: frc
            - opcode: mul
            - opcode: frc
        emit:
          - opcode: mov
            operands:
              - type: temp
                from_handle: ign_sample_coord
                components:
                  kind: mask
                  value: xy
              - capture: ign_coord
          - opcode: utof
            operands:
              - type: temp
                from_handle: ign_sample_coord
                components:
                  kind: mask
                  value: z
              - type: constant_buffer
                from_handle: frame_constants
                indices:
                  - immediate_lo: 0
                components:
                  kind: select
                  value: x
          - opcode: sample_l
            operands:
              - capture: ign_dst
              - type: temp
                from_handle: ign_sample_coord
                components:
                  kind: swizzle
                  value: xyzx
              - type: resource
                from_handle: ign_blue_noise
              - type: sampler
                from_handle: ign_sampler
              - type: immediate32
                indices:
                  - immediate_lo: 0x00000000
