version: 1
steps:
  - kind: add_temp
    name: add_tmp0
    handles: [tmp0]

  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: check_opcode_count
    name: require_frc_opcode
    opcode: frc
    expected_count: 1

  - kind: check_resource_count
    name: require_resource_floor
    expected_resources: 0

  - kind: apply_rules
    name: apply_probe
    mode: match_all
    if:
      state: require_sm5_0
    rules:
      - name: apply_probe_rule
        match:
          opcode: frc
          rewrite_mode: none

  - kind: add_input
    name: add_runtime_input
    handle: in_runtime
    auto_bind: true
    if:
      and:
        - state: require_sm5_0
        - state: require_resource_floor
