version: 1
steps:
  - kind: add_temp
    name: add_tmp0
    handle: tmp0

  - kind: prefilter
    name: require_mul_probe
    checks:
      - kind: check_pattern_match
        match:
          opcode: mul

  - kind: apply_rules
    name: apply_probe
    mode: MatchAll
    rules:
      - match:
          opcode: frc
          rewrite_mode: None

  - kind: refresh_resources
    name: refresh
    if:
      all:
        - state: require_mul_probe
        - state: require_mul_probe

  - kind: verify_program
    name: verify
    if:
      any:
        - state: require_mul_probe
        - state: optional_probe
          not: true
