version: 1
steps:
  - kind: apply_rules
    name: invalid_replay_object_index_hi
    rules:
      - name: rule
        match:
          opcode: mul
          operands:
            - type: temp
              capture: dst
              indices:
                - representation: immediate64
                  capture: dst_reg
            - capture: src
        emit:
          - opcode: mov
            operands:
              - type: temp
                indices:
                  - representation: immediate64
                    immediate_lo: 0
                    immediate_hi: { from: dst_reg }
              - capture: src
