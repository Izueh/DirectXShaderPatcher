          resource_class: SRV
          resource_kind: Texture2D
          bind: 8
          space: 0
        - index: 3
          kind: any
          capture: coord_x
        - index: 4
          kind: instruction
          opcode: add
          operands:
            - index: 0
              kind: any
              capture: coord_y
            - index: 1
              kind: instruction
              opcode: mul
              operands:
                - index: 0
                  kind: instruction
                  opcode: and
                - index: 1
                  kind: any
    emit:
      - kind: create_handle
        id: fast_noise_raw_handle
        resource: fast_noise
      - kind: annotate_handle
        id: fast_noise_handle
        handle: fast_noise_raw_handle
        resource: fast_noise
      - kind: create_handle
        id: frame_raw_handle
        resource: frame_constants
      - kind: annotate_handle
        id: frame_handle
        handle: frame_raw_handle
        resource: frame_constants
      - kind: call
        id: frame_load
        opcode: CBufferLoadLegacy
        type: I32
        operands:
          - index: 1
