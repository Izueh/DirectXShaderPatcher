          - index: 2
            kind: constant_int
            value: 0
      - kind: extract
        id: frame_index
        aggregate: frame_load
        index: 0
      - kind: binop
        id: slice_index
        opcode: URem
        type: I32
        operands:
          - index: 0
            kind: temporary
            id: frame_index
          - index: 1
            kind: constant_int
            value: 32
      - kind: call
        id: noise_load
        opcode: TextureLoad
        type: F32
        operands:
          - index: 1
            kind: temporary
            id: fast_noise_handle
          - index: 2
            kind: constant_int
            value: 0
          - index: 3
            kind: capture
            capture: coord_x
          - index: 4
            kind: capture
            capture: coord_y
          - index: 5
            kind: temporary
            id: slice_index
          - index: 6
            kind: undef
          - index: 7
            kind: undef
          - index: 8
            kind: undef
    replace_with: noise_load

steps:
  - kind: add_texture
    id: fast_noise
  - kind: add_cbuffer
    id: frame_constants
  - kind: apply_rules
    name: apply_rules:blue_noise_snapshot
    rules:
      - blue_noise_scalar_slice_lhs
      - blue_noise_scalar_slice_rhs
      - blue_noise_vec2_slice_lhs
      - blue_noise_vec2_slice_rhs
    mode: MatchAll
    required: false
  - kind: prune_dead_code
  - kind: refresh_resources
