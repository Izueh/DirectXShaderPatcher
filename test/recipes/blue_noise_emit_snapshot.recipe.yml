          space: 0
        - index: 3
          kind: any
          capture: coord_x
        - index: 4
          kind: instruction
          opcode: add
          operands:
            - index: 0
              kind: instruction
              opcode: mul
              operands:
                - index: 0
                  kind: instruction
                  opcode: and
                - index: 1
                  kind: any
            - index: 1
              kind: any
              capture: coord_y
    emit:
      - kind: create_handle
        id: fast_noise_raw_handle
        resource: fast_noise
      - kind: annotate_handle
        id: fast_noise_handle
        handle: fast_noise_raw_handle
        resource: fast_noise
      - kind: create_handle
        id: frame_raw_handle
        resource: frame_constants
      - kind: annotate_handle
        id: frame_handle
        handle: frame_raw_handle
        resource: frame_constants
      - kind: call
        id: frame_load
        opcode: CBufferLoadLegacy
        type: I32
        operands:
          - index: 1
            kind: temporary
            id: frame_handle
          - index: 2
            kind: constant_int
            value: 0
      - kind: extract
        id: frame_index
        aggregate: frame_load
        index: 0
      - kind: binop
        id: slice_index
        opcode: URem
        type: I32
        operands:
          - index: 0
            kind: temporary
            id: frame_index
          - index: 1
            kind: constant_int
            value: 32
      - kind: call
        id: noise_load
        opcode: TextureLoad
        type: F32
        operands:
          - index: 1
            kind: temporary
            id: fast_noise_handle
          - index: 2
            kind: constant_int
            value: 0
          - index: 3
            kind: capture
            capture: coord_x
          - index: 4
            kind: capture
            capture: coord_y
          - index: 5
            kind: temporary
            id: slice_index
          - index: 6
            kind: undef
          - index: 7
            kind: undef
          - index: 8
            kind: undef
    replace_with: noise_load
  - id: blue_noise_vec2_slice_rhs
    match:
