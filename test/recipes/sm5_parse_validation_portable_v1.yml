version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: add_texture
    name: add_tex0
    handle: tex0
    auto_bind: true

  - kind: add_sampler
    name: add_samp0
    handle: samp0
    auto_bind: true

  - name: portable
    rules:
      - name: portable_sample_rule
        match:
          opcode: sample_l
          operands:
            - capture: dst
            - capture: coord
        emit:
          - opcode: sample_l
            operands:
              - capture: dst
              - capture: coord
              - type: resource
                from_handle: tex0
              - type: sampler
                from_handle: samp0
              - type: immediate32
                indices:
                  - immediate_lo: 0x00000000
      - name: portable_mul_rule
        match:
          opcode: mul
          operands:
            - type: temp
              components:
                kind: mask
                value: xy
              capture: out
            - capture: src
        emit:
          - opcode: mov
            operands:
              - capture: out
              - capture: src
