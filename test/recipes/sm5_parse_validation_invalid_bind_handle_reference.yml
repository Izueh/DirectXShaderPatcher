version: 1
steps:
  - kind: prefilter
    name: require_sm5_0
    checks:
      - kind: check_shader_version
        major: 5
        minor: 0

  - name: bind_validate
    rules:
      - match:
          opcode: sample_l
          operands:
            - capture: dst
            - capture: coord
        emit:
          - opcode: sample_l
            operands:
              - capture: dst
              - capture: coord
              - type: resource
                bind_handle: missing_texture
              - type: sampler
                indices:
                  - immediate_lo: 0
              - type: immediate32
                immediates_f32: [0.0]
