version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - name: interpolation_mode_bad_opcode
    rules:
      - name: rule
        match:
          opcode: ret
        emit:
          - opcode: mov
            interpolation_mode: linear
            operands:
              - type: temp
                indices:
                  - immediate_lo: 0
              - type: temp
                indices:
                  - immediate_lo: 1
