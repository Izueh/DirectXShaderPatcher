version: 1
steps:
  - kind: prefilter
    name: require_sm5_0
    checks:
      - kind: check_shader_version
        major: 5
        minor: 0

  - name: interpolation_mode_bad_opcode
    rules:
      - match:
          opcode: ret
        emit:
          - opcode: mov
            interpolation_mode: linear
            operands:
              - type: temp
                indices:
                  - immediate_lo: 0
              - type: temp
                indices:
                  - immediate_lo: 1
