version: 1
steps:
  - kind: apply_rule
    name: capture_used_samplers
    rewrite_mode: none
    rule:
      match:
        - opcode: sample_l
          operands:
            - type: temp
            - type: temp
            - type: resource
            - type: sampler
              capture: sampler_op
              export_as: used_samplers
