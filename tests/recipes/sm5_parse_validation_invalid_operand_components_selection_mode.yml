version: 1
steps:
  - kind: check_shader_version
    name: require_sm5_0
    major: 5
    minor: 0

  - kind: apply_rule
    name: bad_selector
    rule:
      match:
        - opcode: mul
          operands:
            - type: temp
              components:
                selection_mode: bad_kind
                value: xy
              capture: dst
            - capture: src
      emit:
        - opcode: mov
          operands:
            - capture: dst
            - capture: src
