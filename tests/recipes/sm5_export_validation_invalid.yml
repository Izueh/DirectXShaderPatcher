version: 1
steps:
  - kind: apply_rule
    name: invalid_export_step_first
    rewrite_mode: none
    rule:
      match:
        - opcode: frc
          operands:
            - capture: result1
              export_as: resource_usage

  - kind: apply_rule
    name: invalid_export_step_second
    rewrite_mode: none
    rule:
      match:
        - opcode: frc
          operands:
            - capture: result2
              export_as: resource_usage
