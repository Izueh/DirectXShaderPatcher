version: 1
steps:
  - kind: apply_rule
    name: invalid_export_step_first
    match_mode: match_all
    rewrite_mode: none
    rule:
      match:
        - opcode: Frc
          operands:
            - kind: call
              capture: result1
              export_as: resource_usage

  - kind: apply_rule
    name: invalid_export_step_second
    match_mode: match_all
    rewrite_mode: none
    rule:
      match:
        - opcode: Frc
          operands:
            - kind: call
              capture: result2
              export_as: resource_usage
