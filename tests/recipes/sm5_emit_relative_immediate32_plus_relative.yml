version: 1
steps:
  - kind: apply_rule
    name: emit_relative_immediate32_plus_relative
    rule:
      match:
        - opcode: mov
          operands:
            - type: temp
              capture: dst
      emit:
        - opcode: mov
          operands:
            - type: temp
              capture: dst
            - type: constant_buffer
              indices:
                - representation: immediate32
                  immediate_lo: 0
                - representation: immediate32_plus_relative
                  immediate_lo: 0
                  relative_operand:
                    type: temp
                    components:
                      selection_mode: select
                      value: x
                      num_components: four
                    indices:
                      - representation: immediate32
                        immediate_lo: 0
